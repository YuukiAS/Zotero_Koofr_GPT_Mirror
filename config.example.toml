[mirror]
output_dir = "~/ZoteroGPTMirror"

[export]
source = "fixture"
copy_pdf = true
write_metadata = true
write_index = true

[zotero]
local_api = "http://127.0.0.1:23119/api/"
transport = "auto"

[google_drive]
rclone_remote = "gdrive"
folder = "Zotero"

[sync]
source = "zotero-local"
upload_manifest = false

# OAuth tokens stay in rclone's own config file, not in config.toml.
# Do not put Google tokens, Koofr passwords, or Zotero API keys in this file.
